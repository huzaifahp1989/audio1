<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Listen to Quran recitations, nasheeds, Islamic talks, dua, hadith, audiobooks, and kids audio — free Islamic audio library." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="canonical" href="https://create-me-a-audio.vercel.app/" />
    <meta property="og:url" content="https://create-me-a-audio.vercel.app/" />
    <meta property="og:title" content="Islamic Audio Library" />
    <meta property="og:description" content="Quran, nasheeds, talks, dua & more — stream free Islamic audio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Islamic Audio Library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
            .catch(() => {})

          if ('caches' in window) {
            caches.keys()
              .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
              .catch(() => {})
          }
        })
      }
    </script>
  </body>
</html>
